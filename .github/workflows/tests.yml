name: API tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/legal_consult_test
      PORT: 3100
      FRONTEND_URL: http://localhost:5173
      JWT_SECRET: ci-jwt-secret-0123456789abcdef
      JWT_EXPIRES_IN: 15m
      REFRESH_TOKEN_SECRET: ci-refresh-secret-0123456789abcdef
      REFRESH_TOKEN_EXPIRES_IN: 7d
      UPLOAD_DIR: uploads
      MAX_FILE_SIZE: 5242880
      RATE_LIMIT: 100000
      AUTH_RATE_LIMIT: 100000
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: legal_consult_test
        ports:
          - '5432:5432'
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5

      - name: Налаштування Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Встановлення залежностей
        run: npm ci

      - name: Генерація Prisma Client (папка src/generated не в git)
        run: npx prisma generate

      - name: Міграції тестової бази
        run: npx prisma migrate deploy

      - name: Тести
        run: npm test
